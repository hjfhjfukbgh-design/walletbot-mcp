name: Kripto Guru — continuous agent dispatcher
# Keep scheduled queue active; push on this file triggers an immediate dispatch pass.
# Queue pass: drain prioritized product queue; max three workers per pass. 2026-11-20 CEO reconfirmed two-mode DEMO/LIVE hierarchy and triad architecture. Sort ready tasks by issue number so P0 design #441 is selected before newly created Companion/AI-context tasks.

on:
  push:
    paths:
      - '.github/workflows/agent-dispatcher.yml'
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write

concurrency:
  group: kripto-guru-agent-dispatcher
  cancel-in-progress: false

jobs:
  select:
    concurrency:
      group: kripto-guru-queue-claim
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      has_tasks: ${{ steps.queue.outputs.has_tasks }}
    steps:
      - name: Select up to three ready tasks
        id: queue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ready = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: "agent-ready", per_page: 100
            });
            const selected = [];
            // Oldest explicitly prioritized work first; prevents new tasks starving P0 design.
            ready.sort((a, b) => a.number - b.number);
            for (const issue of ready) {
              if (issue.pull_request) continue;
              const labels = (issue.labels || []).map(x => typeof x === "string" ? x : x.name);
              if (labels.includes("agent-dispatched") || labels.includes("agent-review") || labels.includes("agent-blocked")) continue;
              const marker = issue.body?.match(/<!--\s*kg-child-task:v1;[^>]*role=([A-Z]+);/);
              if (!marker) {
                core.warning(`Issue #${issue.number}: missing valid role marker; left queued.`);
                continue;
              }
              const role = marker[1];
              if (!["BACKEND","FRONTEND","QA","SECURITY","ARCHITECT","ANALYST"].includes(role)) {
                core.warning(`Issue #${issue.number}: unsupported role ${role}; left queued.`);
                continue;
              }
              selected.push({ issue_number: String(issue.number), role, task: issue.body || "", base_branch: "main" });
              if (selected.length === 3) break;
            }
            for (const task of selected) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: Number(task.issue_number), labels: ["agent-dispatched"] });
              await github.rest.issues.removeLabel({ owner, repo, issue_number: Number(task.issue_number), name: "agent-ready" }).catch(() => {});
            }
            core.setOutput("matrix", JSON.stringify({ include: selected }));
            core.setOutput("has_tasks", selected.length ? "true" : "false");
            core.info(`Selected ${selected.length} task(s), concurrency cap=3.`);

  workers:
    needs: select
    if: needs.select.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/role-worker.yml
    with:
      role: ${{ matrix.role }}
      issue_number: ${{ matrix.issue_number }}
      task: ${{ matrix.task }}
      base_branch: ${{ matrix.base_branch }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

