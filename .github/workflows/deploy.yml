
name: deploy

# Serialize production releases and secret uploads to avoid Cloudflare concurrent modifications.
concurrency:
  group: walletbot-mcp-production-deploy
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check miniapp/web/app.js
      - run: node --check miniapp/web/kripto-guru-api.js
      - run: node --check miniapp/web/kripto-guru-ui.js
      - run: node --check miniapp/web/wallet-v2.js
      - run: node --check miniapp/web/trading-v2.js
      - run: node --check miniapp/web/capture-ui.mjs
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    # Production release is a separate, explicit action. Main pushes run CI only.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: TELEGRAM_BOT_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate production secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET OWNER_CHAT_ID API_SECRET GEMINI_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Telegram webhook
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "secret=$TELEGRAM_WEBHOOK_SECRET" \
            "https://walletbot-mcp.hjfhjfukbgh.workers.dev/setup"
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

