
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check miniapp/web/app.js
      - run: node --check miniapp/web/wallet-v2.js
      - run: node --check miniapp/web/trading-v2.js
      - run: node --check miniapp/web/kripto-guru-api.js
      - run: node --check miniapp/web/kripto-guru-ui.js
      - run: node --check miniapp/web/capture-ui.mjs
      - run: node --check miniapp/web/capture-clean-ui.mjs
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: TELEGRAM_BOT_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload Worker secrets
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN --name walletbot-mcp
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx --yes wrangler@3 secret put TELEGRAM_WEBHOOK_SECRET --name walletbot-mcp
          printf '%s' "$OWNER_CHAT_ID" | npx --yes wrangler@3 secret put OWNER_CHAT_ID --name walletbot-mcp
          printf '%s' "$API_SECRET" | npx --yes wrangler@3 secret put API_SECRET --name walletbot-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}

      - name: Setup Telegram webhook
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "secret=$TELEGRAM_WEBHOOK_SECRET" \
            "https://walletbot-mcp.hjfhjfukbgh.workers.dev/setup"
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}

