name: Kripto Guru clean UI screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "miniapp/web/**"
      - ".github/workflows/ui-preview.yml"
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 8
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Check clean UI JavaScript syntax
        run: |
          node --check miniapp/web/kripto-guru-ui.js
          node --check miniapp/web/capture-clean-ui.mjs
      - name: Capture clean UI iPhone previews and contract scenarios
        run: node miniapp/web/capture-clean-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kripto-guru-clean-ui-previews
          path: |
            clean-wallet-*.png
            clean-catalog-*.png
            clean-search-*.png
            clean-stocks-*.png
            clean-asset-*.png
            clean-ticket-*.png
            clean-leverage-*.png
            clean-confirm-*.png
            clean-income-*.png
            clean-bonuses-*.png
            clean-companion-*.png
