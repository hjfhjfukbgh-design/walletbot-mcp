name: Mini App iPhone UI screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "miniapp/web/**"
      - ".github/workflows/ui-preview.yml"
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture iPhone-sized previews
        run: node miniapp/web/capture-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kripto-guru-iphone-ui-previews
          path: |
            wallet-390x844.png
            wallet-430x844.png
            trade-390x844.png
            trade-430x844.png
            trade-list-390x844.png
            trade-list-430x844.png
