name: Kripto Guru — parallel team fan-out

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claim-team-tasks:
    if: github.event_name != 'issues' || github.event.label.name == 'agent-ready'
    concurrency:
      group: kripto-guru-queue-claim
      cancel-in-progress: false
    name: Claim up to one ready task per team
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      has_tasks: ${{ steps.claim.outputs.has_tasks }}
      matrix: ${{ steps.claim.outputs.matrix }}
    steps:
      - name: Bootstrap 18-role task queue (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const repo = process.env.GITHUB_REPOSITORY;
          const gh = (args) => execFileSync("gh", args, {encoding:"utf8",env:process.env}).trim();
          for (const [name,color,description] of [
            ["agent-ready","1D76DB","Задача готова к диспетчеризации"],
            ["agent-dispatched","0E8A16","Задача передана исполнителю"],
            ["agent-blocked","B60205","Задача заблокирована"],
            ["agent-priority","D93F0B","Приоритетная задача для ближайшего цикла"],
            ["team-a","5319E7","Команда A — Trading"],
            ["team-b","0E8A16","Команда B — Product"],
            ["team-c","FBCA04","Команда C — Intelligence"]
          ]) gh(["label","create",name,"--repo",repo,"--color",color,"--description",description,"--force"]);
          const tasks = [["A","BACKEND","[KG-A-01] Trading: Walt MCP read-only integration","Проведи ограниченную реализацию/проверку слоя чтения Walt MCP. Цель: подтвердить и при необходимости улучшить только read-only получение котировок, баланса и позиций через существующие API-границы. Write scope: только src/api.ts. Не вызывай perps_execute_operation и любые инструменты записи. LIVE-разработка разрешена; реальные ордера и изменения аккаунта запрещены. Добавь/уточни безопасную обработку ошибок, если это возможно в рамках файла."],["A","ARCHITECT","[KG-A-02] Trading: архитектура торгового ядра","Проанализируй существующие Walt MCP, src/walt.ts, API и модель состояния. Подготовь план единого ядра DEMO/LIVE с раздельными адаптерами и строгими write-gates. Только отчёт, исходники не менять."],["A","QA","[KG-A-03] Trading: QA-матрица DEMO/LIVE","Составь воспроизводимую QA-матрицу для котировок, баланса, позиций, LONG/SHORT, подготовки ордера, confirmation gate, отказов API и DEMO. Не отправлять реальные ордера. Только отчёт."],["A","SECURITY","[KG-A-04] Trading: Security review Walt MCP","Проведи threat-model Walt MCP: OAuth/токены, tenant isolation, права API, read/write разделение, replay/idempotency, confirmation token и audit trail. Не читать/выводить секреты. Только отчёт."],["A","ANALYST","[KG-A-05] Trading: аудит Walt MCP tools","Сопоставь доступные MCP tools и фактические вызовы проекта; выяви подтверждённые возможности и неизвестное. Особое внимание read-only market data/account state и prepare/execute. Только отчёт."],["A","FRONTEND","[KG-A-06] Trading: интерфейс самостоятельной торговли","В Mini App изучи текущий экран и подготовь небольшой UX-патч для безопасного отображения LIVE-состояния, LONG/SHORT и preview/confirmation gate. Работай только в существующих miniapp/web файлах; не добавляй реальное исполнение ордеров."],["B","FRONTEND","[KG-B-01] Product: единый интерфейс трёх режимов","Реализуй в существующих miniapp/web файлах главный экран выбора DEMO, LIVE и AI TRADING с единым русским брендингом Kripto Guru. Сохрани текущую навигацию и мобильную адаптацию. Не подключай реальные торговые действия."],["B","BACKEND","[KG-B-02] Product: API-контракт трёх режимов","В рамках src/state.ts опиши/реализуй безопасную модель режима пользователя DEMO/LIVE/AI с явной изоляцией состояний и обратной совместимостью. Не меняй секреты, настройки аккаунтов и внешние торговые операции."],["B","ARCHITECT","[KG-B-03] Product: архитектура единого Telegram-продукта","Подготовь архитектуру одного Telegram-бота и Mini App с тремя режимами, единым onboarding, навигацией и границами аккаунтов. Только отчёт."],["B","QA","[KG-B-04] Product: UX и интеграционное тестирование","Подготовь QA-план для переходов DEMO/LIVE/AI, мобильного UI, пустых состояний, ошибок соединения и защиты от случайного переключения. Только отчёт."],["B","SECURITY","[KG-B-05] Product: безопасность Mini App","Проведи аудит Telegram initData, API auth, tenant isolation, XSS, CSRF, режима доступа и утечки данных между пользователями. Только отчёт."],["B","ANALYST","[KG-B-06] Product: пользовательские сценарии","Опиши end-to-end сценарии пользователя: обучение в DEMO, самостоятельная торговля LIVE, наблюдение за AI. Выяви пробелы и критерии готовности. Только отчёт."],["C","BACKEND","[KG-C-01] Intelligence: AI Trading DEMO engine","Разработай изолированный AI Trading Engine только в DEMO/paper. Начни с безопасного цикла: получение доступных рыночных данных, формирование объяснимого сигнала, виртуальная позиция, PnL и журнал решений. Write scope: только src/service.ts. Не вызывай Walt execute, не отправляй реальные ордера и не меняй пользовательский LIVE."],["C","ARCHITECT","[KG-C-02] Intelligence: архитектура AI Trading Engine","Спроектируй AI Trading Engine: market data pipeline, feature extraction, стратегии, risk engine, virtual execution, position monitor, explainability и evaluation. Отдели paper и live execution интерфейсы. Только отчёт."],["C","QA","[KG-C-03] Intelligence: тестирование AI paper trading","Составь тесты симуляции: вход/выход, комиссии, проскальзывание, плечо, ликвидация, stale data, drawdown, отказ источника и воспроизводимость. Только отчёт."],["C","SECURITY","[KG-C-04] Intelligence: Security review автономного ИИ","Проведи threat model AI Trading: изоляция AI-счёта, минимальные API-права, отсутствие withdraw, kill switch, лимиты, audit trail, prompt/data injection и запрет live execution без допуска. Только отчёт."],["C","ANALYST","[KG-C-05] Intelligence: исследование стратегий и данных","Определи доступные источники данных и реалистичный объём анализа рынка; предложи проверяемый baseline стратегии и метрики качества без обещаний доходности. Только отчёт."],["C","FRONTEND","[KG-C-06] Intelligence: прозрачность решений AI","В существующих miniapp/web файлах подготовь отдельный экран/панель наблюдения за AI: что анализирует, сигнал, причина входа/выхода, paper-позиция, PnL и журнал. Не добавляй реальное исполнение."]];
          const existing = JSON.parse(gh(["issue","list","--repo",repo,"--state","all","--limit","200","--json","title"]) || "[]");
          let created = 0;
          for (const [team,role,title,description] of tasks) {
            if (existing.some(x => x.title === title)) continue;
            const key = title.match(/KG-([ABC])-([0-9]+)/)?.[0]?.toLowerCase().replace("kg-","") || "task-"+created;
            const parent = 53;
            const marker = "<!-- kg-child-task:v1;parent="+parent+";key="+key+";team="+team+";role="+role+";depends=none -->";
            const body = marker+"\n\n## Цель\n"+description+"\n\n## Границы безопасности\n- LIVE-разработка разрешена; реальные ордера/исполнение, изменение или закрытие реальных позиций, переводы средств и изменение настроек аккаунта запрещены.\n- AI Trading на этом этапе работает только в DEMO/paper.\n- Не выполнять merge и production deploy.\n- Не запрашивать и не выводить секреты.\n- Результат — Draft PR для code tasks либо отчётный Draft PR для analysis tasks; обязательны доказательства проверок и список непроверенного.\n\nРодительская миссия: #53.";
            gh(["issue","create","--repo",repo,"--title",title,"--body",body,"--label","agent-ready","--label","team-"+team.toLowerCase()]);
            created++;
          }
          const summary = "Bootstrap complete. Existing tasks preserved; newly created: "+created+"; total planned: "+tasks.length+". No trading/deployment actions performed.";
          console.log(summary);
          fsSummary(summary);
          function fsSummary(s) { execFileSync("bash",["-lc","echo "+JSON.stringify(s)+" >> \"$GITHUB_STEP_SUMMARY\""],{env:process.env}); }
          NODE

      - name: Claim one ready task for each team
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const repo = process.env.GITHUB_REPOSITORY;
          const gh = (args) => execFileSync("gh", args, {encoding:"utf8",env:process.env}).trim();
          const assignments = [];
          const teams = ["A","B","C"];
          const roles = new Set(["ARCHITECT","BACKEND","FRONTEND","QA","SECURITY","ANALYST"]);
          const childPattern = /<!-- kg-child-task:v1;parent=(\d+);key=([a-z][a-z0-9-]{2,30});team=([ABC]);role=([A-Z]+);depends=([^ ]*) -->/;
          const doneIssues = JSON.parse(gh(["issue","list","--repo",repo,"--state","all","--label","agent-done","--limit","200","--json","body"]) || "[]");
          const doneKeys = new Set();
          for (const item of doneIssues) {
            const m = String(item.body||"").match(childPattern);
            if (m) doneKeys.add(m[1]+":"+m[2]);
          }
          for (const team of teams) {
            const issues = JSON.parse(gh([
              "issue","list","--repo",repo,"--state","open",
              "--label","agent-ready","--label","team-"+team.toLowerCase(),
              "--limit","100","--json","number,title,body,url,createdAt,labels"
            ]) || "[]");
            const eligible = issues.filter(item => {
              const m = String(item.body||"").match(childPattern);
              if (!m || m[3]!==team || !roles.has(m[4])) return false;
              const deps = m[5] && m[5] !== "none" ? m[5].split(",") : [];
              return deps.every(dep => doneKeys.has(m[1]+":"+dep));
            });
            eligible.sort((left,right) => {
              const lp = (left.labels||[]).some(x => (typeof x==="string"?x:x.name)==="agent-priority") ? 0 : 1;
              const rp = (right.labels||[]).some(x => (typeof x==="string"?x:x.name)==="agent-priority") ? 0 : 1;
              return lp-rp || Date.parse(left.createdAt)-Date.parse(right.createdAt);
            });
            const issue = eligible[0];
            if (!issue) continue;
            const marker = String(issue.body||"").match(childPattern);
            if (!marker || marker[3]!==team || !roles.has(marker[4])) {
              console.log("SKIP #"+issue.number+": missing or invalid team-task metadata");
              continue;
            }
          const expires = new Date(Date.now()+45*60*1000).toISOString().replace(".000","");
            const lease = "<!-- kg-lease:run="+process.env.RUN_ID+";expires="+expires+" -->";
            gh(["issue","comment",String(issue.number),"--repo",repo,"--body","Задача захвачена командой "+team+". Исполнитель запускается; lease до "+expires+".\n\n"+lease]);
            const currentLabels=(issue.labels||[]).map(label=>typeof label==="string"?label:label.name);
            const removeLabels=["agent-ready","orchestrator-ready","agent-review","agent-blocked"].filter(label=>currentLabels.includes(label));
            gh(["issue","edit",String(issue.number),"--repo",repo,...removeLabels.flatMap(label=>["--remove-label",label]),"--add-label","agent-dispatched"]);
            assignments.push({
              team,
              role:marker[4],
              issue_number:String(issue.number),
              task:String(issue.title)+"\n\n"+String(issue.body||"").slice(0,12000),
              base_branch:process.env.GITHUB_REF_NAME
            });
            console.log("CLAIMED #"+issue.number+" for Team "+team+" / "+marker[4]);
          }
          const matrix = {include:assignments};
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            "has_tasks="+(assignments.length?"true":"false")+"\n"+
            "matrix="+JSON.stringify(matrix)+"\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## Parallel fan-out\n\nClaimed tasks: "+assignments.length+" of 3 possible team slots.\n"+
            assignments.map(x=>"- Issue #"+x.issue_number+" — Team "+x.team+" / "+x.role).join("\n")+"\n");
          NODE

  run-team-workers:
    name: Run team ${{ matrix.team }} — issue #${{ matrix.issue_number }}
    needs: claim-team-tasks
    if: needs.claim-team-tasks.outputs.has_tasks == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.claim-team-tasks.outputs.matrix) }}
    uses: ./.github/workflows/role-worker.yml
    with:
      role: ${{ matrix.role }}
      issue_number: ${{ matrix.issue_number }}
      task: ${{ matrix.task }}
      base_branch: ${{ matrix.base_branch }}
    secrets:
      GEMINI_API_KEY: ${{ matrix.team == 'A' && secrets.GEMINI_API_KEY || matrix.team == 'B' && secrets.GEMINI_API_KEY_TEAM_B || secrets.GEMINI_API_KEY_TEAM_C }}
