name: Dependency security audit
on:
  push:
    branches: [feature/gemini-companion-backend]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Report npm audit findings without changing dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log("AUDIT_SUMMARY", JSON.stringify(summary));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log("AUDIT_PACKAGE", JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              via: item.via.map(v => typeof v === "string" ? v : {
                title: v.title,
                url: v.url,
                range: v.range
              }),
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
