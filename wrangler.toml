name = "walletbot-mcp"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "TradingEngine"

[[durable_objects.bindings]]
name = "COMPANION_QUOTA"
class_name = "CompanionQuota"

[[migrations]]
tag = "engine_v1"
new_sqlite_classes = ["TradingEngine"]

[[migrations]]
tag = "companion_quota_v1"
new_sqlite_classes = ["CompanionQuota"]

[assets]
directory = "./miniapp/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Estado do bot (tokens OAuth, grid, modo paper) — namespace "walletbot-mcp-STATE".
[[kv_namespaces]]
binding = "STATE"
id = "f7f3b2036a854b5f861e2a40f6c8cb1e"

# Tick do grid a cada 5 minutos.
[triggers]
crons = ["*/5 * * * *"]

[vars]
WALT_MCP_URL = "https://walletbot.me/bot-relay/public-api/mcp"
WALT_AUTH_ISSUER = "https://walletbot.me/bot-relay/public-api"
# Travas de risco por conta/ordem; o teto de плеча берётся из метаданных контракта.
MAX_ORDER_PCT = "25"           # margem máxima por ordem, % do patrimônio (25% para operar com saldo ~$10)
MAX_TOTAL_EXPOSURE_PCT = "50"  # margem total máxima em posições do grid, % do patrimônio
MAX_DAILY_LOSS_PCT = "5"       # perda diária que pausa o bot
STOP_LOSS_PCT = "5"            # abaixo de (low - 5%) fecha tudo e para o grid
# Sem posição aberta e preço fora da faixa: recentra o grid em -6%/+2% do preço e segue operando.
AUTO_RECENTER = "true"
RECENTER_DOWN_PCT = "6"
RECENTER_UP_PCT = "2"
# "*" = todos os contratos ativos do Walt com volume 24h >= MIN_VOLUME_24H_USD
ALLOWED_MARKETS = "*"
MIN_VOLUME_24H_USD = "1000000"
# Адрес Mini App, которая публикуется вместе с Worker на Cloudflare.
# /setup устанавливает прямой webhook Telegram и кнопку меню.
MINIAPP_URL = "https://walletbot-mcp.hjfhjfukbgh.workers.dev/?build=20261118-authfix-1"
# Canal/grupo que recebe os alertas automáticos (o bot precisa ser admin com permissão de postar).
# Vazio = alertas vão para OWNER_CHAT_ID.
ALERT_CHAT_ID = ""

# Segredos (wrangler secret put ... ou GitHub Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, OWNER_CHAT_ID, API_SECRET
